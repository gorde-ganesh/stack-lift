name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Bump, publish, release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version (all workspaces)
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = "prerelease" ]; then
            npm version prerelease --preid=rc --workspaces --include-workspace-root --no-git-tag-version
          else
            npm version "$BUMP" --workspaces --include-workspace-root --no-git-tag-version
          fi
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          git add -A
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"

      - name: Push commit and tag
        run: |
          git push
          git push --tags

      - name: Build
        run: npm run build

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          BUMP="${{ inputs.bump }}"
          TAG="latest"
          if [ "$BUMP" = "prerelease" ]; then
            TAG="beta"
          fi
          for ws in packages/schemas packages/shared packages/core packages/angular-provider packages/cli; do
            npm publish --workspace="$ws" --tag "$TAG" --provenance --access public
          done

      - name: Create GitHub Release
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          PRERELEASE_FLAG=""
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            $PRERELEASE_FLAG
