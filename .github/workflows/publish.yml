name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Bump, publish, release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version (all workspaces)
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = "prerelease" ]; then
            npm version prerelease --preid=rc --workspaces --include-workspace-root --no-git-tag-version
          else
            npm version "$BUMP" --workspaces --include-workspace-root --no-git-tag-version
          fi
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          # npm version bumps each package's own version but does not update cross-references
          # between workspace packages. Update them with a node script so npm resolves
          # @stack-lift/* deps from the workspace instead of the registry.
          node -e "
            const fs = require('fs'), path = require('path');
            const newVer = process.argv[1];
            const scoped = ['schemas', 'shared', 'core', 'angular-provider'];
            for (const ws of fs.readdirSync('packages')) {
              const p = path.join('packages', ws, 'package.json');
              if (!fs.existsSync(p)) continue;
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              let changed = false;
              for (const section of ['dependencies', 'devDependencies', 'peerDependencies']) {
                if (!pkg[section]) continue;
                for (const name of scoped) {
                  const key = '@stack-lift/' + name;
                  if (pkg[section][key] !== undefined) { pkg[section][key] = newVer; changed = true; }
                }
              }
              if (changed) fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
          " "$VERSION"
          # Delete the stale lock file and regenerate so npm ci works on the next run.
          rm package-lock.json
          npm install --ignore-scripts
          git add -A
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"

      - name: Push commit and tag
        run: |
          git push
          git push --tags

      - name: Build
        run: npm run build

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          BUMP="${{ inputs.bump }}"
          TAG="latest"
          if [ "$BUMP" = "prerelease" ]; then
            TAG="beta"
          fi
          for ws in packages/schemas packages/shared packages/core packages/angular-provider packages/cli; do
            npm publish --workspace="$ws" --tag "$TAG" --provenance --access public
          done

      - name: Create GitHub Release
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          PRERELEASE_FLAG=""
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            $PRERELEASE_FLAG
